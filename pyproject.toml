[project]
name = "become"
version = "1.0.0b1"
description = "Python implementation of the BeCoMe group decision-making method"
authors = [{ name = "Ekaterina Kuzmina" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "pydantic==2.13.5",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "pytest-postgresql==9.0.0",
    "pytest-xdist==3.8.0",
    "hypothesis==6.165.10",
    "ruff==0.16.5",
    "mypy==2.3.1",
    "pip-audit==2.10.1",
    "bandit[toml]==1.9.4",
    "detect-secrets==1.5.0",
    "pre-commit==4.6.2",
    "pip==26.2.1",
    "types-passlib==1.7.7.20260211",
    "types-regex==2026.7.19.20260720",
    "boto3-stubs[s3]==1.43.83",
    "mutmut==3.7.0",
    "locust==2.46.4",
    "fakeredis==2.37.1",
]
viz = [
    "numpy==2.5.2",
    "pandas==3.0.5",
    "matplotlib==3.11.1",
    "plotly==7.0.0",
    "seaborn==0.13.2",
    "openpyxl==3.1.5",
    "graphviz==0.21",
]
notebook = [
    "jupyter==1.1.1",
    "ipykernel==7.3.0",
    "ipywidgets==8.1.9",
    "notebook==7.6.2",
]
docs = [
    "mkdocs==1.6.1",
    "mkdocs-material==9.7.7",
    # Ships with mkdocs-material, pinned here because the snippets extension is what
    # pulls the per-directory READMEs onto the site instead of copying them.
    "pymdown-extensions==11.0.2",
]
api = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "pydantic-settings==2.15.0",
    "httpx==0.28.1",
    "sqlmodel==0.0.42",
    "alembic==1.19.1",
    "psycopg2==2.9.12",
    "PyJWT==2.13.0",
    "passlib[bcrypt]==1.7.4",
    "python-multipart==0.0.32",
    "email-validator==2.3.0",
    "regex==2026.7.19",
    "boto3==1.43.83",
    "slowapi==0.1.10",
    "bleach==6.4.0",
    "pillow==12.3.0",
    "sentry-sdk[fastapi]==2.68.1",
    "logtail-python==0.4.0",
    "reportlab==5.0.1",
    "redis==8.1.0",
    "dnspython==2.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = [".venv", "venv", "__pycache__"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "S",      # flake8-bandit (security)
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific rules
]
ignore = [
    "E501",     # line too long (handled by formatter)
    "RUF022",   # `__all__` is not sorted
    "N999",     # invalid module name (BeCoMe has capitals)
    "E402",     # module level import not at top of cell
    "B008",     # function call in default argument (FastAPI Depends pattern)
]

[tool.ruff.lint.per-file-ignores]
# Tests intentionally use assert, hardcoded test credentials, and non-crypto randomness.
"tests/**" = ["S101", "S105", "S106", "S311"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.bandit]
# bandit is the authoritative security gate in CI; ruff "S" gives fast local feedback.
# Tests and autogenerated migrations are excluded (assert and test creds are expected there).
exclude_dirs = ["tests", "migrations", ".venv"]

[tool.mypy]
python_version = "3.13"
strict = true
show_error_codes = true
exclude = [
    "examples/visualizations/",
    "migrations/",
]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "reportlab.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
# Unit before integration, and the two named rather than the "tests" root. Both
# matter: xdist hands tests to workers in collection order, and putting the heavy
# integration tests first costs about half again as long: 72s against 48s for the
# same 1727 tests on eight workers. Naming the root walks the directories
# alphabetically, which puts integration first, so `pytest tests/` pays that.
testpaths = ["tests/unit", "tests/integration"]
# `logical` rather than `auto`: for `auto`, xdist asks psutil for *physical* cores,
# and the CI runner is a hyperthreaded VM, four logical cores over two physical,
# so `auto` resolved to 2 and ran the suite on half the machine. This Mac has no
# SMT, where the two counts agree, so the switch changes nothing locally and
# doubles the workers in CI. To pick a different number on one machine, set
# PYTEST_XDIST_AUTO_NUM_WORKERS: xdist reads it before it ever reaches psutil.
addopts = ["-v", "-n", "logical", "--cov=src", "--cov=api"]
asyncio_mode = "strict"
markers = [
    "e2e: end-to-end tests requiring running server and PostgreSQL",
]
filterwarnings = [
    # SQLite in-memory database cleanup during GC is uncontrollable
    # Warning may come from inspect module when analyzing sqlite objects
    "ignore:unclosed database:ResourceWarning",
]

[tool.coverage.run]
# Out of the repository root: the root is the first thing a newcomer reads, and a
# machine-written data file competes there with the files that actually explain the
# project. coverage.py creates the parent directory itself, verified 02.09.
data_file = ".cache/coverage/.coverage"

[tool.mutmut]
paths_to_mutate = "src/"
runner = "python -m pytest -x -q --assert=plain -c /dev/null tests/unit/models tests/unit/calculators tests/unit/interpreters tests/integration/test_excel_reference.py tests/integration/test_data_loading.py"
