[project]
name = "become"
version = "1.0.0b1"
description = "Python implementation of the BeCoMe group decision-making method"
authors = [{ name = "Ekaterina Kuzmina" }]
license = { text = "PolyForm-Noncommercial-1.0.0" }
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "pydantic==2.14.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "pytest-cov==7.1.0",
    "pytest-postgresql==10.0.0",
    "pytest-xdist==3.8.0",
    "hypothesis==6.170.15",
    "ruff==0.17.5",
    "mypy==2.4.1",
    "pip-audit==2.10.1",
    "bandit[toml]==1.9.4",
    "detect-secrets==1.5.0",
    "pre-commit==4.7.0",
    "pip==26.3",
    "types-passlib==1.7.7.20260211",
    "boto3-stubs[s3]==1.44.5",
    "mutmut==3.8.1",
    "locust==2.47.0",
    "fakeredis==2.40.0",
    "lupa==2.8",
    "import-linter==2.17",
]
viz = [
    "numpy==2.5.5",
    "pandas==3.1.1",
    "matplotlib==3.11.2",
    "plotly==7.1.0",
    "seaborn==0.13.2",
    "openpyxl==3.1.5",
    "graphviz==0.21",
]
notebook = [
    "jupyter==1.1.1",
    "ipykernel==7.4.0",
    "ipywidgets==8.1.9",
    "notebook==7.6.5",
]
docs = [
    "mkdocs==1.6.1",
    "mkdocs-material==9.8.1",
    # Ships with mkdocs-material, pinned here because the snippets extension is what
    # pulls the per-directory READMEs onto the site instead of copying them, and because
    # `scripts/docs/toc.py` imports its slug function to get the same anchors the site
    # and GitHub use.
    "pymdown-extensions==13.1",
    # Arrives with mkdocs anyway. Named because that same script imports it directly,
    # and an undeclared import is one dependency bump away from a puzzling failure.
    "markdown==3.11.3",
]
api = [
    "fastapi==0.163.2",
    "uvicorn[standard]==0.54.0",
    "pydantic-settings==2.16.3",
    "httpx==0.28.1",
    "sqlmodel==0.0.44",
    "alembic==1.20.1",
    "psycopg2==2.9.13",
    # Lowercase on purpose: Dependabot's uv updater matches names case-sensitively.
    "pyjwt==2.15.1",
    "passlib[bcrypt]==1.7.4",
    "python-multipart==0.0.34",
    "email-validator==2.4.0",
    "boto3==1.44.5",
    "slowapi==0.1.10",
    "bleach==6.4.0",
    "pillow==13.0.0",
    "sentry-sdk[fastapi]==2.75.0",
    "logtail-python==0.5.5",
    "reportlab==5.1.0",
    "redis==8.1.0",
    "dnspython==2.9.2",
]
assistant = [
    # Newest mutually compatible releases, audited with pip-audit: the agent stack
    # (langchain, langgraph, langsmith, openai) on 2026-09-29, the rest on 2026-09-23.
    # pgvector is intentionally absent: langchain-postgres 0.0.18 requires pgvector<0.4 and pulls it
    # in transitively; our code never imports it directly.
    # Keep this order: each package comes after the packages it depends on. Dependabot
    # bumps a group one package at a time in the order listed here, so a package listed
    # before its dependency is tried against the old pin and the whole run fails.
    "langsmith==0.15.0",
    "langchain-core==1.8.2",
    "langchain-text-splitters==1.1.3",
    "openai==3.55.0",
    "langchain-openai==1.8.1",
    "psycopg[binary]==3.3.9",
    "langchain-postgres==0.0.19",
    "langgraph==1.2.22",
    "langchain==1.5.0",
    "pypdf==7.1.0",  # security fixes
    "pylatexenc==2.11",
    # langchain_core.embeddings.fake wraps its own `import numpy as np` in
    # contextlib.suppress(ImportError), so DeterministicFakeEmbedding - which the
    # dense-search test uses - raises NameError at call time without
    # this, not an ImportError at import time. Same pin already used by the viz extra.
    "numpy==2.5.5",
    "rank-bm25==0.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = [".venv", "venv", "__pycache__"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "S",      # flake8-bandit (security)
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific rules
    "TID251", # banned APIs (see banned-api below)
    "TID252", # relative imports
]
ignore = [
    "E501",     # line too long (handled by formatter)
    "RUF022",   # `__all__` is not sorted
    "N999",     # invalid module name (BeCoMe has capitals)
    "E402",     # module level import not at top of cell
    "B008",     # function call in default argument (FastAPI Depends pattern)
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# The environment is read in api/config.py and, apart from one marked override in
# migrations/env.py, nowhere else, so every value passes the Settings validators and
# per-profile defaults. fastapi.HTTPException stays allowed:
# a route that raises it must log for itself, which a ban cannot express.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"os.getenv".msg = "Read the environment through Settings in api/config.py."
"os.environ".msg = "Read the environment through Settings in api/config.py."
"os.environb".msg = "Read the environment through Settings in api/config.py."
"os.getenvb".msg = "Read the environment through Settings in api/config.py."
"os.putenv".msg = "Do not change the process environment; Settings in api/config.py reads it."
"os.unsetenv".msg = "Do not change the process environment; Settings in api/config.py reads it."

[tool.ruff.lint.per-file-ignores]
"api/config.py" = ["TID251"]
# CI scripts outside the application read their own environment (the DAST gate has no Settings).
".github/dast/*.py" = ["TID251"]
# Tests intentionally use assert, hardcoded test credentials, and non-crypto randomness,
# and set the environment before Settings loads.
"tests/**" = ["S101", "S105", "S106", "S311", "TID251"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.bandit]
# bandit is the authoritative security gate in CI; ruff "S" gives fast local feedback.
# Tests and autogenerated migrations are excluded (assert and test creds are expected there).
exclude_dirs = ["tests", "migrations", ".venv"]

[tool.mypy]
python_version = "3.13"
strict = true
show_error_codes = true
exclude = [
    "examples/visualizations/",
    "migrations/",
]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "reportlab.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pylatexenc.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "rank_bm25.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
# Unit before integration, and the two named rather than the "tests" root. Both
# matter: xdist hands tests to workers in collection order, and putting the heavy
# integration tests first costs about half again as long: 72s against 48s for the
# same 1727 tests on eight workers. Naming the root walks the directories
# alphabetically, which puts integration first, so `pytest tests/` pays that.
testpaths = ["tests/unit", "tests/integration"]
# `logical` rather than `auto`: for `auto`, xdist asks psutil for *physical* cores,
# and the CI runner is a hyperthreaded VM, four logical cores over two physical,
# so `auto` resolved to 2 and ran the suite on half the machine. This Mac has no
# SMT, where the two counts agree, so the switch changes nothing locally and
# doubles the workers in CI. To pick a different number on one machine, set
# PYTEST_XDIST_AUTO_NUM_WORKERS: xdist reads it before it ever reaches psutil.
addopts = ["-v", "-n", "logical", "--cov=src", "--cov=api"]
asyncio_mode = "strict"
markers = [
    "e2e: end-to-end tests requiring running server and PostgreSQL",
]
filterwarnings = [
    # SQLite in-memory database cleanup during GC is uncontrollable
    # Warning may come from inspect module when analyzing sqlite objects
    "ignore:unclosed database:ResourceWarning",
]

[tool.coverage.run]
# Out of the repository root: the root is the first thing a newcomer reads, and a
# machine-written data file competes there with the files that actually explain the
# project. coverage.py creates the parent directory itself, verified 02.09.
data_file = ".cache/coverage/.coverage"

[tool.mutmut]
source_paths = ["src/"]
also_copy = ["examples/"]
# Same test selection the old mutmut 2 runner used: the core library tests only.
pytest_add_cli_args_test_selection = [
    "tests/unit/models",
    "tests/unit/calculators",
    "tests/unit/interpreters",
    "tests/integration/test_excel_reference.py",
    "tests/integration/test_data_loading.py",
]
# mutmut drives pytest in-process from a copy of the project in mutants/, so the
# global addopts must not apply there: xdist workers would hide the stats mutmut
# collects, and coverage would only slow every mutant run down.
pytest_add_cli_args = ["-o", "addopts=", "-p", "tests.mutmut_support"]

# Layer boundaries of the backend, checked by `uv run lint-imports` in CI. The
# ignore_imports list is the violations that exist today: a baseline to shrink over
# time, not patterns to copy. A new violation fails the check, and so does a listed one
# that has been fixed but not deleted from the list (unmatched ignores are errors).
[tool.importlinter]
root_packages = ["src", "api"]
# Needed so a contract can name sqlmodel and sqlalchemy.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The core library (src) does not depend on the web API (api)"
type = "forbidden"
source_modules = ["src"]
forbidden_modules = ["api"]

[[tool.importlinter.contracts]]
name = "Routes do not touch the database directly"
type = "forbidden"
source_modules = ["api.routes"]
forbidden_modules = ["sqlmodel", "sqlalchemy", "api.db.engine", "api.db.session"]
# Routes import api.db.models for type names, and the models import sqlmodel, so an
# indirect chain exists by design. This contract forbids only the direct import.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Backend layers: routes, services, schemas, db, utils"
type = "layers"
# Order measured on the import graph: services import schemas, schemas import db models and
# utils, and db imports neither; utils is lowest so generic helpers stay free of the app.
layers = ["api.routes", "api.services", "api.schemas", "api.db", "api.utils"]
# Existing upward imports, to be removed over time; not allowed patterns.
ignore_imports = [
    "api.schemas.calculation -> api.services.agreement_level",
    "api.schemas.data_export -> api.services.likert_verdict",
    "api.utils.streaming -> api.services.storage.stored_object",
]
