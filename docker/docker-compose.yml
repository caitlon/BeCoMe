# BeCoMe - local Docker Compose stack
#
# For local use only. The deploys run on Railway from docker/Dockerfile and
# frontend/Dockerfile, and this stack cannot run as a deploy: the prod profile refuses
# a loopback FRONTEND_BASE_URL and needs a Redis, which this file does not start.
#
# Usage (from docker/):
#   SECRET_KEY set in docker/.env (see docker/.env.example), then:
#   docker compose up --build
#
# Environment variables:
#   APP_ENV          - Deployment profile (default: dev). The stack runs the dev profile only; prod does not start here
#   SECRET_KEY       - REQUIRED. Generate with: openssl rand -hex 32
#   POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB - Database credentials (default: become)
#   UVICORN_WORKERS  - Number of API workers (default: 1; more need a Redis, which this stack does not run)
#   DEBUG            - Enable debug mode (default: false)
#   ASSISTANT_ENABLED - Build the API image with the assistant extra (build arg only, default: false)

services:
  # ============================================
  # PostgreSQL Database
  # ============================================
  db:
    image: postgres:16
    container_name: become-db
    restart: unless-stopped
    # TLS on, with the self-signed "snakeoil" certificate the Debian image ships (the
    # Alpine image has none). The api container reaches this database as "db", which
    # api/db/engine.py treats as remote and connects to with sslmode=require. The key
    # is not secret (every copy of the image has it): this only gives the local stack
    # the same TLS requirement the deploys have.
    command: postgres -c ssl=on -c ssl_cert_file=/etc/ssl/certs/ssl-cert-snakeoil.pem -c ssl_key_file=/etc/ssl/private/ssl-cert-snakeoil.key
    # WARNING: Default credentials for LOCAL DEVELOPMENT ONLY
    # For production: use environment variables or secrets management
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-become}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-become}
      POSTGRES_DB: ${POSTGRES_DB:-become}
    # WARNING: Port exposed for local development/debugging only
    # For production: remove this mapping or bind to 127.0.0.1:5432
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-become} -d ${POSTGRES_DB:-become}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ============================================
  # BeCoMe API
  # ============================================
  api:
    build: &api-build
      context: ..
      dockerfile: docker/Dockerfile
      args:
        ASSISTANT_ENABLED: ${ASSISTANT_ENABLED:-false}
    container_name: become-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment: &api-env
      APP_ENV: ${APP_ENV:-dev}
      DATABASE_URL: postgresql://${POSTGRES_USER:-become}:${POSTGRES_PASSWORD:-become}@db:5432/${POSTGRES_DB:-become}
      # SECRET_KEY is REQUIRED - generate with: openssl rand -hex 32
      SECRET_KEY: "${SECRET_KEY:?Set SECRET_KEY env var}"
      DEBUG: ${DEBUG:-false}
      # CORS_ORIGINS must be a valid JSON array string
      CORS_ORIGINS: '["http://localhost:3000"]'
      # Verification and password-reset emails link to the frontend of this stack.
      FRONTEND_BASE_URL: http://localhost:3000
      # One worker: without REDIS_URL the session store is per process, so a refresh that
      # lands on another worker would end the session.
      UVICORN_WORKERS: ${UVICORN_WORKERS:-1}
    depends_on:
      db:
        condition: service_healthy
        restart: true
      migrate:
        condition: service_completed_successfully

  # ============================================
  # Schema migrations (one-shot)
  # ============================================
  # Runs `alembic upgrade head` in the API image and exits; the api service waits for it.
  # The API never creates the PostgreSQL schema itself, and the deploys run the same
  # command as their pre-deploy step, so without this service a fresh stack has no tables.
  migrate:
    build: *api-build
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment: *api-env
    depends_on:
      db:
        condition: service_healthy

  # ============================================
  # BeCoMe Frontend
  # ============================================
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        # nginx serves only the built SPA, so the bundle calls the API on its own port.
        # frontend/Dockerfile also adds this origin to the CSP connect-src.
        VITE_API_URL: http://localhost:8000/api/v1
    container_name: become-frontend
    restart: unless-stopped
    ports:
      - "3000:8080"
    depends_on:
      api:
        condition: service_healthy
    # 127.0.0.1, not localhost: BusyBox wget resolves localhost to ::1, and nginx listens on IPv4.
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ============================================
  # Assistant vector database (pgvector) - local only
  # ============================================
  # Backs the AI assistant's RAG index on a developer's laptop. The "assistant" profile
  # keeps this out of a plain `docker compose up`. A deployed service
  # points ASSISTANT_VECTOR_DB_URL at its own database, and Settings._validate_assistant_deploy
  # in api/config.py requires one on a deploy, so no deployed environment has a reason to
  # start this container.
  assistant-db:
    image: pgvector/pgvector:0.8.6-pg16
    container_name: become-assistant-db
    restart: unless-stopped
    profiles: ["assistant"]
    environment:
      POSTGRES_USER: assistant
      POSTGRES_DB: assistant
      # No password: the port below is bound to 127.0.0.1 only.
      POSTGRES_HOST_AUTH_METHOD: trust
    # Separate port from the app's own Postgres (5432): the two run side by side on a
    # developer machine, and this one is never meant to be reachable from anywhere but
    # localhost.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - assistant_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistant -d assistant"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  # Named for the Debian postgres:16 image. A cluster created by the former
  # postgres:16-alpine image sorts text differently (musl against glibc), so reusing its
  # volume would leave text indexes out of order; the old become-postgres-data volume is
  # no longer used and can be removed with `docker volume rm become-postgres-data`.
  postgres_data:
    name: become-postgres16-data
  assistant_pg_data:
    name: become-assistant-pg-data
