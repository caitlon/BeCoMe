# BeCoMe API - Docker Compose Configuration
#
# Usage (development):
#   docker compose up --build
#
# Usage (production-like with custom secret):
#   SECRET_KEY=$(openssl rand -hex 32) docker compose up --build
#
# Environment variables:
#   APP_ENV          - Deployment profile: dev | test | prod (default: dev)
#   SECRET_KEY       - REQUIRED for production. Generate with: openssl rand -hex 32
#   POSTGRES_PASSWORD - Database password (default: become, CHANGE for production)
#   UVICORN_WORKERS  - Number of API workers (default: 4)
#   DEBUG            - Enable debug mode (default: false)
#   CORS_ORIGINS     - JSON array of allowed origins, e.g. '["http://localhost:3000"]'
#
# Production considerations:
#   - Always set SECRET_KEY via environment variable
#   - Change default database credentials
#   - Use managed PostgreSQL instead of bundled db service
#   - Remove or restrict exposed ports (5432)
#   - Run behind a reverse proxy (Nginx, Traefik)

services:
  # ============================================
  # PostgreSQL Database
  # ============================================
  db:
    image: postgres:16-alpine
    container_name: become-db
    restart: unless-stopped
    # WARNING: Default credentials for LOCAL DEVELOPMENT ONLY
    # For production: use environment variables or secrets management
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-become}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-become}
      POSTGRES_DB: ${POSTGRES_DB:-become}
    # WARNING: Port exposed for local development/debugging only
    # For production: remove this mapping or bind to 127.0.0.1:5432
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-become} -d ${POSTGRES_DB:-become}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ============================================
  # BeCoMe API (Production)
  # ============================================
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: become-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_ENV: ${APP_ENV:-dev}
      DATABASE_URL: postgresql://${POSTGRES_USER:-become}:${POSTGRES_PASSWORD:-become}@db:5432/${POSTGRES_DB:-become}
      # SECRET_KEY is REQUIRED - generate with: openssl rand -hex 32
      SECRET_KEY: "${SECRET_KEY:?Set SECRET_KEY env var}"
      DEBUG: ${DEBUG:-false}
      # CORS_ORIGINS must be a valid JSON array string
      CORS_ORIGINS: '["http://localhost:3000"]'
      UVICORN_WORKERS: ${UVICORN_WORKERS:-4}
    depends_on:
      db:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ============================================
  # BeCoMe Frontend
  # ============================================
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: become-frontend
    restart: unless-stopped
    ports:
      - "3000:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ============================================
  # Assistant vector database (pgvector) - local only
  # ============================================
  # Backs the local AI assistant's RAG index. The "assistant" profile keeps
  # this out of a plain `docker compose up`: nothing outside a developer's own laptop
  # ever sets ASSISTANT_ENABLED=true (Settings._validate_assistant_local_only in
  # api/config.py refuses to start any deployed profile with it on), so no deployed
  # environment has a reason to start this container either.
  assistant-db:
    image: pgvector/pgvector:0.8.6-pg16
    container_name: become-assistant-db
    restart: unless-stopped
    profiles: ["assistant"]
    environment:
      POSTGRES_USER: assistant
      POSTGRES_DB: assistant
      # No password: the port below is bound to 127.0.0.1 only.
      POSTGRES_HOST_AUTH_METHOD: trust
    # Separate port from the app's own Postgres (5432): the two run side by side on a
    # developer machine, and this one is never meant to be reachable from anywhere but
    # localhost.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - assistant_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistant -d assistant"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ============================================
  # BeCoMe API (Development) - uncomment to use
  # ============================================
  # api-dev:
  #   build:
  #     context: ..
  #     dockerfile: docker/Dockerfile.dev
  #   container_name: become-api-dev
  #   ports:
  #     - "8000:8000"
  #   environment:
  #     APP_ENV: dev
  #     DATABASE_URL: postgresql://${POSTGRES_USER:-become}:${POSTGRES_PASSWORD:-become}@db:5432/${POSTGRES_DB:-become}
  #     SECRET_KEY: "${SECRET_KEY:?SECRET_KEY is required}"
  #     DEBUG: "true"
  #     CORS_ORIGINS: '["http://localhost:3000"]'
  #   # Volume mounts without :ro to allow file generation (migrations, etc.)
  #   volumes:
  #     - ../src:/app/src
  #     - ../api:/app/api
  #   depends_on:
  #     db:
  #       condition: service_healthy

volumes:
  postgres_data:
    name: become-postgres-data
  assistant_pg_data:
    name: become-assistant-pg-data
