site_name: BeCoMe
site_description: Group decision-making on fuzzy expert opinions.
site_url: https://docs.becomify.app/
repo_url: https://github.com/caitlon/BeCoMe
repo_name: caitlon/BeCoMe

docs_dir: docs

# `mkdocs serve` watches only `docs_dir` and this file, so without these the six
# pages under `docs/dev/` would never rebuild while their real source is edited.
# Their own comment tells the reader to edit the README instead of the stub, and
# a live preview that ignores exactly that edit makes the instruction read false.
watch:
  - README.md
  - api/README.md
  - api/db/README.md
  - src/README.md
  - frontend/README.md
  - tests/README.md
  - examples/README.md

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
  # Inter and JetBrains Mono are `--font-sans` and `--font-mono` in
  # `frontend/src/index.css`. Playfair Display, the third face, has no setting
  # here and is fetched from `docs/stylesheets/become.css` instead.
  font:
    text: Inter
    code: JetBrains Mono
  # `custom` everywhere, because the application's palette is monochrome and none
  # of Material's named colours is black or white. The values live in
  # `docs/stylesheets/become.css`.
  #
  # THREE entries, and the first one carries no scheme on purpose. With only the
  # light and dark pair, Material 9.7.7 renders both radios unchecked and the page
  # simply keeps whatever `<body>` was built with, so the system preference is
  # never consulted: the site was stuck on one scheme for every visitor, whatever
  # their machine was set to. The bare `(prefers-color-scheme)` entry is Material's
  # documented way to say "follow the system", and it also gives the reader a third
  # position on the toggle instead of a switch that silently disagrees with their OS.
  palette:
    # `primary` and `accent` are repeated here rather than left out. Omitted,
    # Material fills its own default in, and the built `<body>` comes out carrying
    # `data-md-color-primary="indigo"` before any script runs.
    - media: "(prefers-color-scheme)"
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-auto
        name: Follows your system. Switch to light.
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light. Switch to dark.
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark. Switch back to your system setting.

extra_css:
  - stylesheets/become.css

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  # The one extension this site depends on structurally. Pages under `dev/` are a
  # single include line each, so a README stays where a reader of the repository
  # finds it and the site shows the same bytes. Copying it here instead would give
  # the project two sources for one truth, and the older one always wins by
  # accident. `check_paths` turns a mistyped include into a build failure rather
  # than a silently empty page.
  - pymdownx.snippets:
      base_path: !relative $config_dir
      check_paths: true

# `security.md` deliberately does not ship. It is an engineering document with an
# "Accepted risks" section, which is a list of what the project knowingly does not
# defend against. It stays readable in the repository. Linking it from a product
# site is a different act. A short user-facing security page replaces it later.
exclude_docs: |
  security.md
  uml-diagrams/generate_diagrams.py

validation:
  links:
    absolute_links: warn
    unrecognized_links: warn
    anchors: warn

nav:
  - Home: index.md
  - The method:
      - How it works: method-description.md
      - Diagrams: uml-diagrams/README.md
  - For developers:
      - Setup: development.md
      - Core library: dev/core.md
      - API: dev/api.md
      - Database: dev/database.md
      - Frontend: dev/frontend.md
      - Testing: dev/testing.md
      - Examples: dev/examples.md
      - Environments: environments.md
      - Quality report: quality-report.md
