<!DOCTYPE html>
<html lang="$lang">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<title>$subject</title>
<style>
  body { margin: 0; padding: 0; width: 100% !important; }
  table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
  table { border-collapse: separate; }
  img { border: 0; }
  a { text-decoration: underline; }
  @media only screen and (max-width: 620px) {
    .card { padding: 24px 20px !important; }
  }
  @media (prefers-color-scheme: dark) {
    .page { background-color: #0A0A0A !important; }
    .card { background-color: #1A1A1A !important; border-color: #2B2B2B !important; }
    .rule { border-color: #2B2B2B !important; }
    .text { color: #FAFAFA !important; }
    .muted { color: #A1A1A1 !important; }
    .button-cell { background-color: #FFFFFF !important; }
    .button-link { color: #000000 !important; }
    .fallback-link { color: #FAFAFA !important; }
  }
</style>
</head>
<body class="page" style="margin:0;padding:0;background-color:#F5F5F5;">
<div style="display:none;font-size:1px;line-height:1px;max-height:0;max-width:0;opacity:0;overflow:hidden;mso-hide:all;">$preheader</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#F5F5F5" class="page" style="width:100%;background-color:#F5F5F5;">
<tr>
<td align="center" style="padding:32px 12px;">
<!--[if mso]><table role="presentation" width="600" align="center" cellpadding="0" cellspacing="0" border="0"><tr><td><![endif]-->
<table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:600px;">
<tr>
<td class="text" style="padding:0 4px 16px 4px;font-family:Georgia,'Times New Roman',serif;font-size:24px;line-height:32px;font-weight:normal;color:#1A1A1A;">$wordmark</td>
</tr>
<tr>
<td class="card" bgcolor="#FFFFFF" style="padding:40px;background-color:#FFFFFF;border:1px solid #E6E6E6;border-radius:8px;">
<h1 class="text" style="margin:0 0 16px 0;font-family:Georgia,'Times New Roman',serif;font-size:26px;line-height:32px;font-weight:normal;color:#1A1A1A;">$heading</h1>
<p class="text" style="margin:0 0 28px 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:24px;color:#1A1A1A;">$body</p>
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 28px 0;">
<tr>
<td class="button-cell" align="center" bgcolor="#000000" style="background-color:#000000;border-radius:6px;mso-padding-alt:14px 28px;">
<a href="$action_url" class="button-link" style="display:inline-block;padding:14px 28px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:24px;font-weight:bold;color:#FFFFFF;text-decoration:none;border-radius:6px;">$button_label</a>
</td>
</tr>
</table>
<p class="muted" style="margin:0 0 8px 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px;line-height:20px;color:#595959;">$fallback</p>
<p style="margin:0 0 28px 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px;line-height:20px;word-break:break-all;"><a href="$action_url" class="fallback-link" style="color:#1A1A1A;text-decoration:underline;word-break:break-all;">$action_url</a></p>
$rows
</td>
</tr>
<tr>
<td class="muted" style="padding:20px 4px 0 4px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:20px;color:#595959;">$footer</td>
</tr>
</table>
<!--[if mso]></td></tr></table><![endif]-->
</td>
</tr>
</table>
</body>
</html>
