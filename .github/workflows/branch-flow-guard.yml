name: Branch Flow Guard

# Enforces the promotion chain: feature/fix -> dev -> prod.
#
# GitHub branch protection cannot restrict a PR's SOURCE branch natively, so this
# required check fails any PR into `prod` that does not come from `dev`.
# Feature/fix PRs into `dev` are unrestricted.

on:
  pull_request:
    branches:
      - prod

permissions:
  contents: read

jobs:
  enforce-flow:
    name: Enforce promotion chain
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check base/head branch pair
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          echo "PR: $HEAD -> $BASE"
          if [ "$HEAD" != dev ]; then
            echo "::error::PRs into 'prod' (production) must come from 'dev'. Got '$HEAD'. Allowed flow: dev -> prod."
            exit 1
          fi
          echo "Promotion chain respected."
