name: Branch Flow Guard

# Enforces the promotion chain: feature/fix -> dev -> test -> prod.
#
# GitHub branch protection cannot restrict a PR's SOURCE branch natively, so this
# required check fails any PR into `test` or `prod` that does not come from the
# allowed upstream branch. Feature/fix PRs into `dev` are unrestricted.

on:
  pull_request:
    branches:
      - prod
      - test

permissions:
  contents: read

jobs:
  enforce-flow:
    name: Enforce promotion chain
    runs-on: ubuntu-latest
    steps:
      - name: Check base/head branch pair
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          echo "PR: $HEAD -> $BASE"
          case "$BASE" in
            prod)
              if [ "$HEAD" != "test" ]; then
                echo "::error::PRs into 'prod' (production) must come from 'test'. Got '$HEAD'. Allowed flow: dev -> test -> prod."
                exit 1
              fi
              ;;
            test)
              if [ "$HEAD" != "dev" ]; then
                echo "::error::PRs into 'test' must come from 'dev'. Got '$HEAD'. Allowed flow: dev -> test -> prod."
                exit 1
              fi
              ;;
          esac
          echo "Promotion chain respected."
