name: Merge Guard

# Fails while a pull request carries the `do-not-merge` label, so "not yet" is visible on the
# pull request itself instead of living in a comment. Removing the label turns the check green.
#
# Why a workflow of its own. A label change fires `labeled` or `unlabeled`, and adding those event
# types to ci.yml would rerun the whole pipeline (lint, tests, end-to-end, SonarCloud) every time
# someone sets a label. This job takes seconds and starts nothing else.
#
# Listed among the required status checks on `dev`, it makes the label block the merge itself, not
# only the reader's attention.
#
# Safety. The job reads the label list through the API with a read-only token and nothing else:
# no checkout, no third-party action. The pull request number and repository reach the script
# through env, never spliced into the script text.
#
# The job reads the labels as they are when it runs, not from the event. Opening a pull request
# with several labels fires several events within a second, and their runs can start in any
# order. Reading the current list means every run gives the same answer, and re-running one reports
# the state now.
#
# No concurrency group, on purpose. A cancelled run stays on the head commit: the commit shows a
# red cross with every check green, and a cancelled run of this required check blocks the merge.
on:
  pull_request:
    branches: [dev, test, prod]
    types: [opened, reopened, synchronize, labeled, unlabeled]

permissions:
  pull-requests: read

jobs:
  merge-guard:
    name: Merge guard
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Fail while do-not-merge is set
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          blocked=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq 'any(.labels[]; .name == "do-not-merge")') || blocked=unreadable
          case "$blocked" in
            true)
              echo "::error title=Merge guard::This pull request carries the do-not-merge label. Remove the label when it may be merged."
              exit 1
              ;;
            false)
              echo "No do-not-merge label."
              ;;
            *)
              echo "::error title=Merge guard::Could not read the label list."
              exit 1
              ;;
          esac
