name: CI

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main, develop, staging]

# Least-privilege default for GITHUB_TOKEN; every job here only reads the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: Code Quality Checks
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      # Python setup
      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13.7

      - name: Install Python dependencies
        run: uv sync --locked --extra dev --extra api

      # mypy runs in strict mode over src/ + api/; caching .mypy_cache lets it
      # re-check only changed files instead of the whole tree every run.
      - name: Cache mypy
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}
          restore-keys: |
            mypy-${{ runner.os }}-

      # Python linting
      - name: Check code formatting
        run: uv run ruff format --check .

      - name: Run linting
        run: uv run ruff check .

      - name: Run security linting (bandit)
        run: uv run bandit -c pyproject.toml -r src api --severity-level medium

      - name: Run type checking
        run: uv run mypy src/ api/

      - name: Scan for secrets (detect-secrets)
        run: uv run detect-secrets-hook --baseline .secrets.baseline $(git ls-files -- ':!:migrations' ':!:frontend/src/i18n' ':!:uv.lock' ':!:frontend/package-lock.json')

      # Node.js setup
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # TypeScript linting
      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: Check TypeScript types
        working-directory: frontend
        run: npx tsc -p tsconfig.app.json --noEmit

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-24.04
    # Network-bound audits (pip-audit -> pypi.org, npm audit -> npm registry) live here,
    # not in the required "Code Quality Checks" job, so a transient registry timeout cannot
    # fail the required lint check or skip the test jobs that depend on it. Retries absorb
    # flaky network; a real vulnerability still fails the job after all attempts.
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13.7

      - name: Install Python dependencies
        run: uv sync --locked --extra dev --extra api

      - name: Audit Python dependencies (pip-audit)
        run: |
          for attempt in 1 2 3; do
            uv run pip-audit --timeout 30 && exit 0
            echo "::warning::pip-audit attempt $attempt failed (network?); retrying in 15s"
            sleep 15
          done
          echo "::error::pip-audit failed after 3 attempts"
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit npm dependencies
        working-directory: frontend
        run: |
          for attempt in 1 2 3; do
            npm audit --omit=dev --audit-level=moderate && exit 0
            echo "::warning::npm audit attempt $attempt failed (network?); retrying in 15s"
            sleep 15
          done
          echo "::error::npm audit failed after 3 attempts"
          exit 1

  python-tests:
    name: Python Tests
    runs-on: ubuntu-24.04
    needs: lint
    env:
      APP_ENV: "test"
      SECRET_KEY: test-secret-key-for-ci
      TESTING: "1"

    steps:
      # A shallow clone is enough here; only the SonarCloud job needs full history for
      # its blame data, and it does its own checkout.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13.7

      - name: Install Python dependencies
        run: uv sync --locked --extra dev --extra api

      # ubuntu-24.04 installs postgresql-16 (see the runner-images toolset manifest)
      # but does not put its version-specific binaries on PATH, so
      # shutil.which("pg_ctl") returns None and the PostgreSQL-gated tests (the
      # migration test plus test_postgres_integration.py, 11 tests total) silently
      # skip instead of running.
      - name: Add PostgreSQL 16 binaries to PATH
        run: echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"

      # Fail loudly if the binaries are not where expected, instead of letting a
      # wrong path silently reintroduce the skip this step exists to prevent.
      - name: Verify PostgreSQL binaries are on PATH
        run: |
          command -v pg_ctl || { echo "::error::pg_ctl not found on PATH; PostgreSQL-gated tests would silently skip"; exit 1; }
          pg_ctl --version

      - name: Run Python tests with coverage
        run: uv run pytest tests/unit/ tests/integration/ -n auto --cov=src --cov=api --cov-report=term-missing --cov-report=html --cov-report=xml:coverage.xml

      - name: Upload Python coverage XML
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-coverage-xml
          path: coverage.xml
          retention-days: 30

      - name: Upload Python coverage HTML
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-coverage-report
          path: htmlcov/
          retention-days: 30

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-24.04
    needs: lint

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests with coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-coverage-report
          path: frontend/coverage/
          retention-days: 30

  backend-e2e:
    name: Backend E2E Tests
    runs-on: ubuntu-24.04
    # Deliberately not gated on lint: E2E exercises a running server and does not care
    # whether ruff or mypy is happy, so waiting for that job only adds a minute of idle
    # time to the pipeline's critical path.
    env:
      APP_ENV: "test"
      TESTING: "1"

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: become
          POSTGRES_PASSWORD: become
          POSTGRES_DB: become_e2e
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13.7

      - name: Install dependencies
        run: uv sync --locked --extra dev --extra api

      - name: Start API server
        run: |
          uv run uvicorn api.main:app --host 0.0.0.0 --port 8000 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/api/v1/health && break
            echo "Waiting for API... ($i/30)"
            sleep 2
          done
          curl -sf http://localhost:8000/api/v1/health || { echo "API failed to start"; exit 1; }
        env:
          DATABASE_URL: postgresql://become:become@localhost:5432/become_e2e
          SECRET_KEY: test-secret-key-for-ci
          CORS_ORIGINS: '["http://localhost:8080"]'
          DEBUG: "false"
          # E2E signs up under a synthetic domain that has no DNS records, and CI
          # runners should not depend on a live resolver anyway.
          MX_CHECK_ENABLED: "false"

      - name: Run backend E2E tests
        # E2E exercises a separate uvicorn process, so in-process coverage measures
        # nothing here; --no-cov skips the instrumentation the shared addopts add.
        run: uv run pytest tests/e2e/ -v -m e2e --no-cov
        env:
          DATABASE_URL: postgresql://become:become@localhost:5432/become_e2e
          SECRET_KEY: test-secret-key-for-ci

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-24.04
    # Not gated on lint either -- this is the longest job in the pipeline, so starting it
    # a minute earlier shortens the whole run by that minute.
    env:
      APP_ENV: "test"
      TESTING: "1"

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: become
          POSTGRES_PASSWORD: become
          POSTGRES_DB: become_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13.7

      - name: Install Python dependencies
        run: uv sync --locked --extra dev --extra api

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps

      - name: Start API server
        run: |
          uv run uvicorn api.main:app --host 0.0.0.0 --port 8000 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/api/v1/health && break
            echo "Waiting for API... ($i/30)"
            sleep 2
          done
          curl -sf http://localhost:8000/api/v1/health || { echo "API failed to start"; exit 1; }
        env:
          DATABASE_URL: postgresql://become:become@localhost:5432/become_test
          SECRET_KEY: test-secret-key-for-ci
          CORS_ORIGINS: '["http://localhost:8080"]'
          DEBUG: "false"
          # E2E signs up under a synthetic domain that has no DNS records, and CI
          # runners should not depend on a live resolver anyway.
          MX_CHECK_ENABLED: "false"

      - name: Run E2E tests
        working-directory: frontend
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-24.04
    needs: [python-tests, frontend-tests]
    if: github.event_name == 'pull_request'
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Download Python coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: python-coverage-xml
          path: .

      - name: Download frontend coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: frontend-coverage-report
          path: frontend/coverage/

      - name: SonarQube Cloud Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@713881670b6b3676cda39549040e2d88c70d582e # v8
