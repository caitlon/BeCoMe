name: CI

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main, develop, staging]

# Least-privilege default for GITHUB_TOKEN; every job here only reads the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# uv does not byte-compile what it installs, and a runner is a fresh container every
# time, so without this each xdist worker recompiles all of site-packages from source
# on every run. Measured locally: it adds 1.0s to `uv sync` (1.3 -> 2.3) and takes
# about a tenth off the test step.
env:
  UV_COMPILE_BYTECODE: "1"

jobs:
  lint:
    name: Code Quality Checks
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Python setup
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13.7

      - name: Install Python dependencies
        run: uv sync --locked --extra dev --extra api

      # mypy runs in strict mode over src/ + api/; caching .mypy_cache lets it
      # re-check only changed files instead of the whole tree every run.
      - name: Cache mypy
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}
          restore-keys: |
            mypy-${{ runner.os }}-

      # Python linting
      - name: Check code formatting
        run: uv run ruff format --check .

      - name: Run linting
        run: uv run ruff check .

      - name: Run security linting (bandit)
        run: uv run bandit -c pyproject.toml -r src api --severity-level medium

      - name: Run type checking
        run: uv run mypy src/ api/

      - name: Scan for secrets (detect-secrets)
        run: uv run detect-secrets-hook --baseline .secrets.baseline $(git ls-files -- ':!:migrations' ':!:frontend/src/i18n' ':!:uv.lock' ':!:frontend/package-lock.json')

      # Node.js setup
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # TypeScript linting
      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: Check TypeScript types
        working-directory: frontend
        run: npx tsc -p tsconfig.app.json --noEmit

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-24.04
    # Network-bound audits (pip-audit -> pypi.org, npm audit -> npm registry) live here,
    # not in the required "Code Quality Checks" job, so a transient registry timeout cannot
    # fail the required lint check or skip the test jobs that depend on it. Retries absorb
    # flaky network; a real vulnerability still fails the job after all attempts.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13.7

      - name: Install Python dependencies
        run: uv sync --locked --extra dev --extra api

      - name: Audit Python dependencies (pip-audit)
        run: |
          for attempt in 1 2 3; do
            uv run pip-audit --timeout 30 && exit 0
            echo "::warning::pip-audit attempt $attempt failed (network?); retrying in 15s"
            sleep 15
          done
          echo "::error::pip-audit failed after 3 attempts"
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit npm dependencies
        working-directory: frontend
        run: |
          for attempt in 1 2 3; do
            npm audit --omit=dev --audit-level=moderate && exit 0
            echo "::warning::npm audit attempt $attempt failed (network?); retrying in 15s"
            sleep 15
          done
          echo "::error::npm audit failed after 3 attempts"
          exit 1

  python-tests:
    name: Python Tests
    runs-on: ubuntu-24.04
    needs: lint
    env:
      APP_ENV: "test"
      SECRET_KEY: test-secret-key-for-ci
      TESTING: "1"

    steps:
      # A shallow clone is enough here; only the SonarCloud job needs full history for
      # its blame data, and it does its own checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13.7

      - name: Install Python dependencies
        run: uv sync --locked --extra dev --extra api

      # ubuntu-24.04 installs postgresql-16 (see the runner-images toolset manifest)
      # but does not put its version-specific binaries on PATH, so
      # shutil.which("pg_ctl") returns None and the PostgreSQL-gated tests (the
      # migration test plus test_postgres_integration.py, 11 tests total) silently
      # skip instead of running.
      - name: Add PostgreSQL 16 binaries to PATH
        run: echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"

      # Fail loudly if the binaries are not where expected, instead of letting a
      # wrong path silently reintroduce the skip this step exists to prevent.
      - name: Verify PostgreSQL binaries are on PATH
        run: |
          command -v pg_ctl || { echo "::error::pg_ctl not found on PATH; PostgreSQL-gated tests would silently skip"; exit 1; }
          pg_ctl --version

      - name: Run Python tests with coverage
        run: uv run pytest tests/unit/ tests/integration/ --cov=src --cov=api --cov-report=term-missing --cov-report=html --cov-report=xml:coverage.xml

      - name: Upload Python coverage XML
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-coverage-xml
          path: coverage.xml
          retention-days: 30

      - name: Upload Python coverage HTML
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-coverage-report
          path: htmlcov/
          retention-days: 30

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-24.04
    needs: lint

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests with coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-coverage-report
          path: frontend/coverage/
          retention-days: 30

  backend-e2e:
    name: Backend E2E Tests
    runs-on: ubuntu-24.04
    # Deliberately not gated on lint: E2E exercises a running server and does not care
    # whether ruff or mypy is happy, so waiting for that job only adds a minute of idle
    # time to the pipeline's critical path.
    env:
      APP_ENV: "test"
      TESTING: "1"

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: become
          POSTGRES_PASSWORD: become
          POSTGRES_DB: become_e2e
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13.7

      - name: Install dependencies
        run: uv sync --locked --extra dev --extra api

      - name: Start API server
        run: |
          uv run uvicorn api.main:app --host 0.0.0.0 --port 8000 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/api/v1/health && break
            echo "Waiting for API... ($i/30)"
            sleep 2
          done
          curl -sf http://localhost:8000/api/v1/health || { echo "API failed to start"; exit 1; }
        env:
          DATABASE_URL: postgresql://become:become@localhost:5432/become_e2e
          SECRET_KEY: test-secret-key-for-ci
          CORS_ORIGINS: '["http://localhost:8080"]'
          DEBUG: "false"
          # E2E signs up under a synthetic domain that has no DNS records, and CI
          # runners should not depend on a live resolver anyway.
          MX_CHECK_ENABLED: "false"

      - name: Run backend E2E tests
        # E2E exercises a separate uvicorn process, so in-process coverage measures
        # nothing here; --no-cov skips the instrumentation the shared addopts add.
        # -n 0 opts out of the shared -n logical as well: every worker would share
        # the one uvicorn and the one Postgres, and the client's 10s timeout in
        # tests/e2e/conftest.py is exceeded once the worker count climbs.
        run: uv run pytest tests/e2e/ -v -m e2e --no-cov -n 0
        env:
          DATABASE_URL: postgresql://become:become@localhost:5432/become_e2e
          SECRET_KEY: test-secret-key-for-ci

  # One shard per browser. The three of them run the same 73 functional specs, and a
  # single runner cannot go wider than two workers: it advertises four cores over two
  # physical ones, and at four workers the summed test time grew 70% while the wall
  # clock fell only 13%. Extra parallelism therefore has to come from extra machines.
  # Shares of one run: webkit 442s, firefox 304s, chromium 225s plus wcag 47s, which
  # is why webkit is split again below and the other two are not.
  e2e-shard:
    name: E2E shard (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      # One browser failing should not cancel the others: knowing whether a break is
      # webkit-only or everywhere is most of what the split buys.
      fail-fast: false
      matrix:
        include:
          # WebKit twice. Whole, it ran 239 seconds of tests against chromium's 172 and
          # became the only thing the pipeline waited on, at 363 seconds against 251.
          # Halved, each part lands beside the other shards and the run ends when the
          # slowest of four finishes rather than when webkit does.
          - name: webkit-1
            browsers: webkit
            projects: --project=webkit --shard=1/2
          - name: webkit-2
            browsers: webkit
            projects: --project=webkit --shard=2/2
          - name: firefox
            browsers: firefox
            projects: --project=firefox
          # Chromium carries the two single-browser projects as well: both are Desktop
          # Chrome, so they need no second browser download.
          - name: chromium
            browsers: chromium
            projects: --project=chromium --project=wcag-audit
    # Not gated on lint either. This is the longest job in the pipeline, so starting it
    # a minute earlier shortens the whole run by that minute.
    env:
      APP_ENV: "test"
      TESTING: "1"
      # An account is unusable until its emailed link is redeemed, so the suite has to
      # read that link somewhere. The console sender prints it to the API's stdout and
      # this file captures it. Job-level because two steps need to agree on the path,
      # and on the key the link's recipient tag is derived from.
      E2E_API_LOG: /tmp/become-e2e-api.log
      SECRET_KEY: test-secret-key-for-ci
      # Never let a provider variable from anywhere else select a real sender: a runner
      # that mailed a synthetic @test.com address on every signup would be an outbound
      # spam source and would starve the suite of the link it needs.
      EMAIL_PROVIDER: console

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: become
          POSTGRES_PASSWORD: become
          POSTGRES_DB: become_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13.7

      - name: Install Python dependencies
        run: uv sync --locked --extra dev --extra api

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browsers }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-${{ matrix.browsers }}-

      # Only this shard's browser. Downloading all three cost between 50 and 509
      # seconds depending on how the cache landed, and two of them went unused.
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps ${{ matrix.browsers }}

      - name: Start API server
        run: |
          # PYTHONUNBUFFERED because stdout to a file is block-buffered: without it the
          # activation link sits in a 8 KiB buffer and the suite times out waiting.
          PYTHONUNBUFFERED=1 uv run uvicorn api.main:app --host 0.0.0.0 --port 8000 \
            > "$E2E_API_LOG" 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/api/v1/health && break
            echo "Waiting for API... ($i/30)"
            sleep 2
          done
          curl -sf http://localhost:8000/api/v1/health || {
            echo "API failed to start"; tail -n 40 "$E2E_API_LOG"; exit 1;
          }
        env:
          DATABASE_URL: postgresql://become:become@localhost:5432/become_test
          # https: the e2e dev server runs on TLS so the browser will store the
          # __Host- session cookies (frontend/scripts/e2e-cert.mjs explains why).
          CORS_ORIGINS: '["https://localhost:8080"]'
          # Where the activation links point. Matching the Playwright origin makes the
          # mailed link the same one a browser can open, as it is in a real deploy.
          FRONTEND_BASE_URL: https://localhost:8080
          DEBUG: "false"
          # E2E signs up under a synthetic domain that has no DNS records, and CI
          # runners should not depend on a live resolver anyway.
          MX_CHECK_ENABLED: "false"

      - name: Run E2E tests
        working-directory: frontend
        run: npx playwright test ${{ matrix.projects }}

      # Alone, at one worker, which is the concurrency its baselines were recorded at.
      # Eight tests and 31 seconds, so giving them their own pass costs almost nothing.
      - name: Run visual regression tests
        if: matrix.name == 'chromium'
        working-directory: frontend
        run: npx playwright test --project=visual-regression --workers=1

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-${{ matrix.name }}
          path: frontend/playwright-report/
          retention-days: 7

      # Uploaded rather than echoed into the job log: it carries the raw activation
      # tokens the console sender prints. They are single-use, belong to @test.com
      # accounts, and die with the job's Postgres service container, but there is no
      # reason to publish them when a downloaded artifact debugs the run just as well.
      - name: Upload API log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-api-log-${{ matrix.name }}
          path: /tmp/become-e2e-api.log
          retention-days: 7

  # `E2E Tests (Playwright)` is a required status check on develop, staging and main, so
  # the split has to keep a job under exactly that name or every pull request into them
  # would wait forever for a check that no longer runs. This one only reports the shards.
  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-24.04
    needs: e2e-shard
    if: always()
    steps:
      - name: Report shard results
        run: |
          echo "shards: ${{ needs.e2e-shard.result }}"
          if [ "${{ needs.e2e-shard.result }}" != "success" ]; then
            echo "::error::at least one E2E shard did not pass"
            exit 1
          fi

  # Runs on pull requests and on pushes to `main`. Analysing only pull requests left the main
  # branch itself unanalysed since 2026-02-21, reporting 76.7% coverage against a real 99%, and
  # a pull request's "new code" is measured against its base, so a stale base made unrelated
  # old code count as new, which is what failed the gate on the promotion in #326 over CSS
  # introduced by a different pull request. Keeping `main` current fixes that at the root.
  #
  # `develop` and `staging` are deliberately not analysed: branch analysis for anything but the
  # main branch is a paid SonarCloud feature, and this organization is on the free plan (its API
  # answers "Organization is not allowed to access data from non main branches"). Pushing an
  # analysis for them would burn a CI job on a result nothing can read.
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-24.04
    needs: [python-tests, frontend-tests]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Download Python coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: python-coverage-xml
          path: .

      - name: Download frontend coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: frontend-coverage-report
          path: frontend/coverage/

      # SonarCloud's new-code period for this project is "previous version", but no version was
      # ever reported, so every analysis looked like the same one and the period degenerated.
      # The release tags are the meaningful boundary here, so the latest one becomes the version
      # and "new code" reads as "changed since the last release".
      #
      # The latest tag in the repository, not `git describe`. Releases are tagged on `main`,
      # which is downstream of `develop`, so a release tag is never reachable from `develop`.
      # `git describe` there answers with the release before last, and a pull request opened from
      # `develop` would compare against a different baseline than one opened from `main`. Falls
      # back to the commit only when no tag exists.
      - name: Derive the analysed version from the latest release tag
        id: sonar_version
        run: |
          version="$(git tag --sort=-v:refname | head -1)"
          echo "version=${version:-$(git rev-parse --short HEAD)}" >> "$GITHUB_OUTPUT"

      - name: SonarQube Cloud Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8
        with:
          args: -Dsonar.projectVersion=${{ steps.sonar_version.outputs.version }}
