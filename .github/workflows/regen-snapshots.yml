name: Regenerate Visual Snapshots

# Manually regenerates Playwright visual-regression baselines on the amd64 CI
# runner, inside the Playwright image the E2E job uses (the only environment whose
# rendering matches that job), and uploads the updated *-linux.png files as an
# artifact. Use after an intentional layout change shifts the whole-page
# project-results snapshots; then download the artifact and commit the PNGs onto
# the feature branch.
#
# Run it with `gh workflow run regen-snapshots.yml --ref <feature-branch>`
# (optionally `-f grep=...`, where `-f grep=` updates every snapshot), or pick the
# branch in "Use workflow from" in the Actions tab. The job builds the branch it is
# dispatched on, so its run and cache scope belong to that branch, not to dev.
# Uploading an artifact needs only the default read token, so no repository
# permission change is required.
#
# FALLBACK: if this workflow is unavailable, the fresh amd64 renders are
# already inside the failed E2E run's report, so harvest them instead:
#   1. gh run download <run-id> -n playwright-report-chrome-audits -D <dir>
#      (the visual-regression pass runs in the chrome-audits shard)
#   2. <dir>/index.html embeds the report as a base64 zip in
#      <template id="playwrightReportBase64">; decode + unzip it. The JSONs
#      inside list attachments named "<snapshot>-actual/-expected/-diff.png",
#      each pointing at data/<sha1>.png.
#   3. The "-actual" files are the new baselines. Sanity-check that each
#      "-expected" matches the currently committed PNG, then copy the
#      "-actual" ones over frontend/e2e/visual-regression.spec.ts-snapshots/
#      <snapshot>-visual-regression-linux.png and commit.
# Only the *-linux.png baselines are tracked; *-darwin.png are gitignored and
# are regenerated locally with `npx playwright test --project=visual-regression
# --update-snapshots`.

on:
  workflow_dispatch:
    inputs:
      grep:
        description: "Playwright -g filter selecting which tests to update; empty updates all"
        required: false
        default: "project results"
        type: string

permissions:
  contents: read

jobs:
  regen:
    name: Regenerate snapshots (amd64)
    runs-on: ubuntu-24.04
    # The same environment as the e2e-shard job in ci.yml, whose comments explain each
    # value: the tests register users and read the activation link from the API log.
    env:
      APP_ENV: "test"
      TESTING: "1"
      E2E_API_LOG: /tmp/become-e2e-api.log
      SECRET_KEY: test-secret-key-for-ci
      EMAIL_PROVIDER: console

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: become
          POSTGRES_PASSWORD: become
          POSTGRES_DB: become_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # No dependency cache: this job builds the branch it is dispatched on.
      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false

      - name: Set up Python
        run: uv python install 3.13.7

      - name: Install Python dependencies
        run: uv sync --locked --extra dev --extra api

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Pull Playwright image
        timeout-minutes: 5
        run: scripts/ci/playwright-image.sh pull

      - name: Start API server
        run: |
          PYTHONUNBUFFERED=1 uv run uvicorn api.main:app --host 0.0.0.0 --port 8000 \
            > "$E2E_API_LOG" 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/api/v1/health && break
            echo "Waiting for API... ($i/30)"
            sleep 2
          done
          curl -sf http://localhost:8000/api/v1/health || {
            echo "API failed to start"; tail -n 40 "$E2E_API_LOG"; exit 1;
          }
        env:
          DATABASE_URL: postgresql://become:become@localhost:5432/become_test
          CORS_ORIGINS: '["https://localhost:8080"]'
          FRONTEND_BASE_URL: https://localhost:8080
          DEBUG: "false"
          MX_CHECK_ENABLED: "false"

      # One worker, as ci.yml runs them: the concurrency the baselines are compared at.
      # An empty grep updates every snapshot.
      - name: Update snapshots
        env:
          GREP: ${{ inputs.grep }}
        run: |
          args=(test --project=visual-regression --workers=1 --update-snapshots)
          if [ -n "$GREP" ]; then args+=(-g "$GREP"); fi
          scripts/ci/playwright-image.sh run "${args[@]}"

      - name: Upload regenerated snapshots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: regenerated-snapshots
          path: frontend/e2e/visual-regression.spec.ts-snapshots/*-linux.png
          if-no-files-found: error

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      # An artifact rather than the job log: it carries single-use activation tokens.
      - name: Upload API log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-api-log
          path: /tmp/become-e2e-api.log
          retention-days: 7
