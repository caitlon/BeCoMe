version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    assignees:
      - "caitlon"
    labels:
      - "dependencies"
      - "area:core"
    # sqlmodel 0.0.45 maps datetime fields to its own UTCDateTime type, which rejects a
    # naive value on write and hands back an aware one on read. The models here store
    # naive UTC in timestamp-without-time-zone columns, so two email verification tests
    # fail under it. Drop the entry once the models are moved to the new type and a
    # column migration ships with them. Seen on PR #515.
    ignore:
      - dependency-name: "sqlmodel"
        versions: [">=0.0.45"]
    groups:
      python-deps:
        patterns:
          - "*"

  # The scanner tooling of the DAST workflow is its own uv project, so the main
  # project's entry does not see it.
  - package-ecosystem: "uv"
    directory: "/.github/dast"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    assignees:
      - "caitlon"
    labels:
      - "dependencies"
      - "area:infra"
    groups:
      dast-deps:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    assignees:
      - "caitlon"
    labels:
      - "dependencies"
      - "area:frontend"
    ignore:
      # typescript-eslint 8 declares a peer range of typescript <6.1.0, so TypeScript 7
      # fails npm ci. Drop the entry when typescript-eslint supports it.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      npm-major:
        patterns:
          - "*"
        update-types:
          - "major"

  - package-ecosystem: "npm"
    directory: "/.railway"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    assignees:
      - "caitlon"
    labels:
      - "dependencies"
      - "area:infra"

  # Bumps the exact Node tag of the frontend build stage and the digest of the nginx
  # stage, whose `alpine` tag is kept beside it. Weekly rather than monthly, because a
  # pinned reference no longer picks up a patch release on its own. The Node major
  # stays at 22, the version CI tests the frontend on.
  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    assignees:
      - "caitlon"
    labels:
      - "dependencies"
      - "area:infra"
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    # The second entry reaches the actions pinned inside the local composite actions.
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    assignees:
      - "caitlon"
    labels:
      - "dependencies"
      - "area:infra"
    groups:
      github-actions:
        patterns:
          - "*"
