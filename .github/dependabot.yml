version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    reviewers:
      - "caitlon"
    assignees:
      - "caitlon"
    labels:
      - "dependencies"
      - "area:core"
    # sqlmodel 0.0.45 maps datetime fields to its own UTCDateTime type, which rejects a
    # naive value on write and hands back an aware one on read. The models here store
    # naive UTC in timestamp-without-time-zone columns, so two email verification tests
    # fail under it. Drop the entry once the models are moved to the new type and a
    # column migration ships with them. Seen on PR #515.
    ignore:
      - dependency-name: "sqlmodel"
        versions: [">=0.0.45"]
    groups:
      python-deps:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    reviewers:
      - "caitlon"
    assignees:
      - "caitlon"
    labels:
      - "dependencies"
      - "area:frontend"
    ignore:
      # typescript-eslint 8 declares a peer range of typescript <6.1.0, so TypeScript 7
      # fails npm ci. Drop the entry when typescript-eslint supports it.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      npm-major:
        patterns:
          - "*"
        update-types:
          - "major"

  - package-ecosystem: "npm"
    directory: "/.railway"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    reviewers:
      - "caitlon"
    assignees:
      - "caitlon"
    labels:
      - "dependencies"
      - "area:infra"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    reviewers:
      - "caitlon"
    assignees:
      - "caitlon"
    labels:
      - "dependencies"
      - "area:infra"
    groups:
      github-actions:
        patterns:
          - "*"
