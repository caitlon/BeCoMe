version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    reviewers:
      - "caitlon"
    assignees:
      - "caitlon"
    labels:
      - "dependencies"
      - "area:core"
    groups:
      python-deps:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    reviewers:
      - "caitlon"
    assignees:
      - "caitlon"
    labels:
      - "dependencies"
      - "area:frontend"
    # happy-dom 20.12.0 made Animation.cancel() reject the animation's finished promise
    # with an AbortError, which is what the Web Animations spec asks for. framer-motion
    # stops animations on unmount and does not catch it, so a full vitest run ends with
    # a few hundred unhandled rejections and a non-zero exit while every test passes.
    # 20.14.5 still showed it, so everything from 20.12.0 up is held back. Drop the entry
    # once the interaction is fixed. Seen on PR #364.
    ignore:
      - dependency-name: "happy-dom"
        versions: [">=20.12.0"]
      # typescript-eslint 8 declares a peer range of typescript <6.1.0, so TypeScript 7
      # fails npm ci. Drop the entry when typescript-eslint supports it.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      npm-major:
        patterns:
          - "*"
        update-types:
          - "major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    reviewers:
      - "caitlon"
    assignees:
      - "caitlon"
    labels:
      - "dependencies"
      - "area:infra"
    groups:
      github-actions:
        patterns:
          - "*"
