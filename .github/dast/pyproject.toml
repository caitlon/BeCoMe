[project]
name = "become-dast"
version = "0.0.0"
description = "Pinned scanner tooling for the DAST workflow. Not part of the application."
requires-python = ">=3.13"
dependencies = [
    "schemathesis==4.34.2",
]

[tool.uv]
package = false
# Resolution ignores releases newer than this date. uv accepts "7 days" here, but the pinned
# schemathesis 4.34.2 was published on 2026-11-24 and cannot resolve under it until a week
# has passed, so the cut-off is a fixed date. Move it forward when the lock is refreshed.
exclude-newer = "2026-11-25T00:00:00Z"
