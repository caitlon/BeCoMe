# Rules for the ZAP API scan (zap-api-scan.py -c). Tab-separated: id, action, text.
# The import step requests every operation once, so logout is also removed from the spec by
# make_zap_spec.py; this line keeps the scanner itself away from it.
*	OUTOFSCOPE	.*/api/v1/auth/logout.*
# 10062 (PII disclosure) reads any run of 12 to 19 digits as a card number. The API holds no
# payment data, and the last group of a random UUID is sometimes all digits, so the rule fires
# at random on id fields.
10062	IGNORE	(PII: UUID digit runs read as card numbers)
