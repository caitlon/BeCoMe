name: Set up Python and uv
description: Install uv with Python 3.13.7 and sync the locked dependencies of the chosen extras.

inputs:
  extras:
    description: Space-separated pyproject.toml extras to install, for example "dev api".
    required: false
    default: ''
  enable-cache:
    description: Passed to astral-sh/setup-uv as enable-cache.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    # python-version only sets UV_PYTHON for the later steps. It does not create or
    # activate a venv (activate-environment stays false), so `uv sync` below makes
    # .venv in the repository root and `uv run` finds it, as it always has here. uv
    # downloads the interpreter on first use.
    - name: Set up uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        enable-cache: ${{ inputs.enable-cache }}
        python-version: 3.13.7

    - name: Install Python dependencies
      shell: bash
      env:
        EXTRAS: ${{ inputs.extras }}
      run: |
        args=()
        for e in $EXTRAS; do args+=(--extra "$e"); done
        uv sync --locked "${args[@]}"
