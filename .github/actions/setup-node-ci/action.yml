name: Set up Node.js and frontend dependencies
description: Install Node.js 22 and run npm ci in frontend/.

inputs:
  cache:
    description: Set to 'false' to skip the npm dependency cache.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Setup Node.js
      if: inputs.cache == 'true'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Setup Node.js (no cache)
      if: inputs.cache != 'true'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
      with:
        node-version: '22'
        package-manager-cache: false

    - name: Install frontend dependencies
      shell: bash
      working-directory: frontend
      run: npm ci
