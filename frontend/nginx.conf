# BeCoMe Frontend - Nginx Configuration
#
# Serves the built React SPA and nothing else: there is no proxy to the API. The SPA calls
# the API at VITE_API_URL, a build arg of frontend/Dockerfile, which also puts that origin
# into the Content-Security-Policy below (__API_ORIGIN__).

server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Cloudflare origin check: $origin_allowed is set by docker-entrypoint.d/40-origin-lock.sh.
    if ($origin_allowed = 0) {
        return 403;
    }

    # Gzip compression for better performance
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # The build prerenders every public page to <route>/index.html. Those are tried by
    # name, not as a directory: `$uri/` would answer /about with a 301 to
    # http://<host>:8080/about/, a redirect built from the internal port. Anything else
    # is a real 404, so a crawler does not index a soft 404: the app routes behind a
    # login are the allowlist below, and every other path gets the not-found page.
    # `expires -1` sends Cache-Control: no-cache, so a new deploy reaches browsers at
    # once; an `add_header Cache-Control` here would drop the security headers the
    # server level sets, the same inheritance rule as the asset block below.
    location / {
        try_files $uri $uri/index.html =404;
        expires -1;
    }

    # The page for every 404, status included, a missing asset too. It is rendered by the
    # build (dist/404.html) with a noindex tag, and the browser mounts the app fresh over
    # it, so an address the router does know (say /Login, which the router matches in any
    # case) still shows its page. No add_header in this block either, for the same reason.
    # `expires` does nothing for a 404, so no Cache-Control is sent; the response has an
    # ETag but no Last-Modified, so a cache has no freshness to work from and revalidates.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Railway's healthcheck path: 200 with an empty body, never the app shell. No add_header
    # here, for the same reason as above. The origin check at server level still applies, and
    # 40-origin-lock.sh lets the probe host through without the secret.
    location = /healthz {
        return 200;
    }

    # Cache static assets. A location with its own add_header stops inheriting the
    # server-level ones, so the security headers are repeated here to cover JS/CSS/images.
    # The pattern ends in \z, not $: PCRE's $ also matches before a trailing newline, and
    # nginx matches the decoded URI, so /x.js%0A would count as an asset.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)\z {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:__API_ORIGIN__; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'sha256-i9u9g/VRCYFxR5dHeV0Ig4iufaCsQyV3bcWcN9MQKl8=' https://challenges.cloudflare.com; connect-src 'self'__API_ORIGIN__ https://*.ingest.sentry.io https://*.ingest.de.sentry.io https://*.ingest.us.sentry.io; frame-src 'self' https://challenges.cloudflare.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;  # pragma: allowlist secret
    }

    # The routes behind a login, which prerender.mjs leaves out (dist/spa.html, the empty
    # shell with a noindex tag, is what the browser takes over). This list must name
    # exactly the routes of src/App.tsx that are not in src/seo/publicRoutes.ts, with `:id`
    # as `[^/\s]+` (an id holds no whitespace, so /projects/abc%0A is a 404 too):
    # tests/seo/routes-in-nginx.test.ts fails when one is added to either side alone.
    # It sits below the asset block, which wins for any path that ends in an asset
    # extension (regex locations are tried in order), so a missing /projects/x.js is a 404.
    # The pattern ends in \z, not $: PCRE's $ also matches before a trailing newline, and
    # nginx matches the decoded URI, so /login%0A would get the app shell with a 200.
    location ~ ^/(login|register|forgot-password|reset-password|verify-email|projects|projects/[^/\s]+|profile|onboarding)/?\z {
        try_files /spa.html =404;
        expires -1;
    }

    # Security headers. The CSP mirrors the API's own policy
    # (api/middleware/security_headers.py) with five deliberate differences:
    #   - connect-src also names the API origin, which is cross-origin on the deploys
    #     (VITE_API_URL is a build arg, substituted into __API_ORIGIN__ at image build),
    #     plus the Sentry ingest hosts the browser SDK reports to;
    #   - img-src names the same API origin, because profile photos are served by the
    #     API (GET /users/{id}/photo) and rendered in <img> tags. That is an image load,
    #     not a fetch, so connect-src does not cover it and the browser drops the
    #     request before it leaves the tab, so avatars silently never appear;
    #   - style-src allows inline styles, which Tailwind and the chart config need;
    #   - script-src and frame-src name Cloudflare's Turnstile host, because the bot
    #     check on the four auth forms loads its script from there and draws its
    #     challenge in an iframe served by it. Both are silent when missing, and both
    #     leave submit disabled for every user of a build that has a sitekey.
    #   - script-src also allows one inline script by its sha256 hash: the pre-paint
    #     theme and language script in index.html, which has to run before first paint.
    #     Never 'unsafe-inline'. The API serves JSON only, so its policy has no such
    #     script. tests/integration/test_frontend_csp.py fails when the hash and the
    #     script drift apart.
    # X-XSS-Protection is 0 on purpose: the legacy auditor it enables is unreliable and
    # has itself been a source of leaks. CSP is what actually blocks injection here.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "0" always;
    # Matches the API's policy. It matters more here than there: the password-reset and
    # activation pages carry their single-use token in the query string, and this keeps
    # the full URL out of the Referer on any cross-origin request the page makes (the
    # Sentry ingest call, for one). Modern browsers default to this exact value, so the
    # header is belt to that braces. It is cheap, and it stops the guarantee from depending
    # on which browser the user happens to run.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:__API_ORIGIN__; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'sha256-i9u9g/VRCYFxR5dHeV0Ig4iufaCsQyV3bcWcN9MQKl8=' https://challenges.cloudflare.com; connect-src 'self'__API_ORIGIN__ https://*.ingest.sentry.io https://*.ingest.de.sentry.io https://*.ingest.us.sentry.io; frame-src 'self' https://challenges.cloudflare.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;  # pragma: allowlist secret
    # nginx serves the internal http hop, so add HSTS unconditionally (the client
    # reaches us over https via Cloudflare/Railway). No "preload" until the domain
    # is actually submitted to the HSTS preload list.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}
